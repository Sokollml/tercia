# ─────────────────────────────────────────────────────────────────────────────
#  Локальный/прод-стек: PostgreSQL + бэкенд (Fastify).
#  Фронтенд (mini-app) деплоится отдельно (Vercel/статика) — он статический.
#
#  Запуск:
#    cp backend/.env.example backend/.env   # заполнить BOT_TOKEN
#    docker compose up --build
#  Бэкенд применяет миграции автоматически при старте.
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-habits}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-habits}
      POSTGRES_DB: ${DB_NAME:-habits}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-habits} -d ${DB_NAME:-habits}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN обязателен}
      MINIAPP_URL: ${MINIAPP_URL:-http://localhost:5173}
      DB_DRIVER: postgres
      DATABASE_URL: postgres://${DB_USER:-habits}:${DB_PASSWORD:-habits}@postgres:5432/${DB_NAME:-habits}
      INITDATA_MAX_AGE_SEC: ${INITDATA_MAX_AGE_SEC:-86400}
    ports:
      - '8080:8080'

volumes:
  pgdata:
