# config.example.yaml — скопируй в config.yaml и укажи свои чаты.
# config.yaml в .gitignore (там список приватных для тебя источников).
#
# ВАЖНО: только ПУБЛИЧНЫЕ чаты/каналы, куда ты вступил обычным способом.
# Никакого парсинга закрытых групп, никакой автоматической подписки.

# Источники: @username публичных групп/каналов, где ищут исполнителей.
chats:
  - "@freelance_chat_example"
  - "@design_orders_example"
  - "@it_zakazy_example"

# Переопределение ключевых слов префильтра (необязательно).
# Если пусто/не задано — берутся дефолты из prefilter.py.
keywords: []

# Дополнительные стоп-слова к дефолтным (склеиваются).
stopwords_extra:
  - "тестовое задание бесплатно"

# Троттлинг: пауза между обработкой чатов и между сообщениями (сек).
# Чем больше — тем «человечнее» и ниже риск бана. НЕ ставь 0.
throttle:
  between_chats_sec: 5
  between_messages_sec: 0.5

# Разовая выгрузка истории: сколько последних сообщений тянуть на чат.
history_limit: 200
