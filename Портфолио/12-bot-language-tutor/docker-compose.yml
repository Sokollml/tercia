services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tutor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tutor}
      POSTGRES_DB: ${DB_NAME:-tutor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tutor} -d ${DB_NAME:-tutor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Force Postgres inside compose regardless of .env's local default.
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
