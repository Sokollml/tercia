services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override to use the bundled Postgres service.
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: giveaway
      DB_USER: giveaway
      DB_PASSWORD: giveaway
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: giveaway
      POSTGRES_USER: giveaway
      POSTGRES_PASSWORD: giveaway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giveaway"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
